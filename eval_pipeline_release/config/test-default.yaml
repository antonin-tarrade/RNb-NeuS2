# Evaluation Pipeline Configuration
# =================================
# Copy this file and customize for your dataset.

# Dataset configuration
dataset:
  name: "my_dataset"                    # Dataset identifier
  objects: [buddhaUMSPS,cowUMSPS]                           # List of object names to process
  methods: [chunkedCuda,cuda,flexicubes,pymcubes]                           # List of method names to evaluate
  num_views: 84                         # Maximum number of camera views

# Path configuration
paths:
  data_root: "/Users/antonin/N7/3A/Stage-M2/sdf-marching-cubes/external/RNb-NeuS2/data/comparison_results/{object}"            # Root directory containing object folders
  output_root: null                     # Output directory (null = same as data_root)

# Mesh cleanup configuration
cleanup:
  dilation_radius: 12                 # Mask dilation radius in pixels
  z_threshold: null                     # Optional: remove points below this z value

# Evaluation configuration
evaluation:
  downsample_density: 0.05              # Point sampling density (mm)
  max_dist: 2.0                         # Maximum distance for outlier filtering (mm)
  fscore_thresholds:                    # Thresholds for F-score computation
    - 0.5
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    - 1.0
    - 1.1
    - 1.2
    - 1.3
    - 1.4
    - 1.5

# Execution configuration
execution:
  mode: "local"                         # Execution mode: "local" or "slurm"

  # Local execution settings
  local:
    max_workers: 4                      # Max parallel jobs (auto-limited by RAM)

  # SLURM execution settings (required if mode="slurm")
  slurm:
    account: "my_account"               # SLURM account
    partition: "my_partition"           # SLURM partition

    # Cleanup stage resources
    cleanup:
      cpus: 4                           # CPUs per job
      mem_gb: 48                        # Memory in GB
      time: "02:00:00"                  # Time limit

    # Evaluation stage resources
    eval:
      cpus: 16                          # CPUs per job
      mem_gb: 64                        # Memory in GB
      time: "04:00:00"                  # Time limit

# Aggregation configuration
aggregation:
  # Optional: Group visibility counts into categories
  # visibility_groups:
  #   low: [1, 5]                       # Range [min, max] inclusive
  #   medium: [6, 20]
  #   high: [21, 84]

  # Optional: Curvature thresholds for categorization
  # curvature_thresholds:
  #   concave: -0.1                     # Below this = concave
  #   convex: 0.1                       # Above this = convex
  visibility_groups: null
  curvature_thresholds: null
